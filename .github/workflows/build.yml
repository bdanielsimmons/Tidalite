name: build
on:
  push:
    branches: ['**']
    # docs-only pushes (README etc.) don't build or release
    paths-ignore: ['**.md']
  workflow_dispatch:
jobs:
  build:
    name: ${{ matrix.os_name }} ${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os_name: windows, flavor: practice, flags: "" }
          - { runner: windows-latest, os_name: windows, flavor: simple, flags: "--no-default-features" }
          - { runner: macos-latest, os_name: mac, flavor: practice, flags: "" }
          - { runner: macos-latest, os_name: mac, flavor: simple, flags: "--no-default-features" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Remember compiled dependencies between builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
      - name: Build
        shell: bash
        env:
          # lets the app know which build it is, so it can find newer releases
          TIDALITE_BUILD: ${{ github.run_number }}
        run: |
          manifest=$(find . -name Cargo.toml -not -path '*/target/*' | head -1)
          if [ -z "$manifest" ]; then
            echo "ERROR: no Cargo.toml anywhere in the repo - the files didn't upload"
            find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          cd "$(dirname "$manifest")"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            cargo build --release ${{ matrix.flags }}
            cp target/release/tidalite.exe "$out/tidalite-${{ matrix.flavor }}.exe"
          else
            # one app that runs on both Apple Silicon and Intel Macs
            cargo build --release ${{ matrix.flags }} --target aarch64-apple-darwin
            cargo build --release ${{ matrix.flags }} --target x86_64-apple-darwin
            lipo -create -output "$out/tidalite" target/aarch64-apple-darwin/release/tidalite target/x86_64-apple-darwin/release/tidalite
            chmod +x "$out/tidalite"
            (cd "$out" && tar -czf "tidalite-${{ matrix.flavor }}-mac.tar.gz" tidalite && rm tidalite)
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: tidalite-${{ matrix.os_name }}-${{ matrix.flavor }}
          path: out/*

  # After every successful build of all four, publish them as a public Release (no tagging needed).
  release:
    needs: build
    # releases come only from main; put [no release] in a commit message to build without publishing
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v9.${{ github.run_number }}"
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Tidalite $tag" --notes "Automatic build of commit ${GITHUB_SHA::7}. Windows: tidalite-practice.exe (everything) or tidalite-simple.exe (no practice tools). Mac: the .tar.gz files." --latest

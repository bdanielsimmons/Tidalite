name: build
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          echo "Files in repo:"
          find . -maxdepth 3 -not -path './.git/*' | head -50
          manifest=$(find . -name Cargo.toml -not -path '*/target/*' | head -1)
          if [ -z "$manifest" ]; then
            echo "ERROR: no Cargo.toml anywhere in the repo - the files didn't upload"
            exit 1
          fi
          dir=$(dirname "$manifest")
          echo "Building in $dir"
          cd "$dir"
          cargo build --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/release/tidalfast.exe "$GITHUB_WORKSPACE/out/tidalfast.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: tidalfast-windows
          path: out/tidalfast.exe